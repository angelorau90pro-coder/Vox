# Configurazione gitleaks di Vox: regole predefinite più eccezioni mirate.
# Le eccezioni del primo blocco dipendono solo dal contenuto (la stringa esatta del falso positivo),
# non dal file né dalla riga: un segreto vero nello stesso file o nella stessa riga viene comunque segnalato.
# Provato con segreti sintetici: i falsi positivi noti passano, un token vero accanto a loro no.
# Nota: con gitleaks 8.30 un blocco con "paths" in AND con "regexes" nasconde tutto il file, quindi non usarlo.

title = "Vox"

[extend]
useDefault = true

# Falsi positivi noti:
# - token finti usati come fixture nei test (voxI18n.test.mjs, cliAgents.fixture.mjs, uri.test.ts);
# - chiave di telemetria pubblica (aiKey) di Microsoft nei package.json delle estensioni integrate di VS Code.
[[allowlists]]
description = "Valori finti o pubblici noti"
regexTarget = "secret"
# ancorate: vale solo il valore esatto; un segreto vero che comincia allo stesso modo ma continua viene segnalato
regexes = [
	'''^ghp_ABCDEFGHIJKL1234$''',
	'''^0b2310c4-3ea6-4207-bbde-9c3710ba0437$''',
	'''^0c6ae279ed8443289764825290e4f9e2-1a736e7c-1324-4338-be46-fc2a58ae4d14-7\d+$''',
]

# Cartelle di lavoro e di compilazione, mai versionate (vedi .gitignore e .git/info/exclude):
# contengono copie dei sorgenti, bundle minificati e rapporti delle AI. Non sono contenuto del repository.
[[allowlists]]
description = "Output generato e non versionato"
paths = [
	'''^\.regia(-run)?/''',
	'''^_lavoro/''',
	'''^\.build/''',
	'''^out(-[a-z]+)?/''',
	'''^node_modules/''',
]
